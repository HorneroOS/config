# HorneroOS Alacritty defaults. Colour values live in the imports below:
# the packaged Signal Night palette, then the applied theme's palette.
[general]
import = ["hornero-signal-night.toml", "hornero-colors.toml"]
live_config_reload = true

[window]
padding = { x = 12, y = 12 }
opacity = 0.88

[scrolling]
history = 2500

[cursor]
style = { shape = "Block", blinking = "Never" }

[mouse]
hide_when_typing = true
