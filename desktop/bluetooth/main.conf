# HorneroOS BlueZ defaults (factory template).
#
# Install (admin, one time): cp /usr/share/hornero/bluetooth/main.conf /etc/bluetooth/main.conf
# Arch's bluez package owns /etc/bluetooth/main.conf, so this package never
# ships that path (a second owner would be a pacman file conflict) and never
# overwrites an admin-edited file. Paired devices live in
# /var/lib/bluetooth (BlueZ state), never in this file, and are untouched.
#
# Power persistence: AutoEnable=true is the stock, correct setting. With
# AutoEnable=true BlueZ restores each controller to its last Powered state
# at startup; with AutoEnable=false controllers are forced off at boot and
# the user's last power choice is never restored. Do NOT set it to false.
# The user's explicit power-off choice is additionally persisted as an
# rfkill soft-block by systemd-rfkill; this file does not fight that layer.

[General]
Name = HorneroOS
ControllerMode = dual
JustWorksRepairing = never
FastConnectable = false
# No permanent discoverability: the adapter is discoverable/pairable only
# while the user opens the Bluetooth pane (DiscoverableTimeout bounds it).
DiscoverableTimeout = 120
PairableTimeout = 120
AlwaysPairable = false

[Policy]
AutoEnable = true

[GATT]
Cache = always
