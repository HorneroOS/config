color0  #142745
color1  #F0765A
color2  #91C8A2
color3  #F2C94C
color4  #7FB0E6
color5  #D99AC0
color6  #6ECFC2
color7  #B9C6DE
color8  #427CCD
color9  #FF9E8A
color10 #B5E3C0
color11 #FFD97A
color12 #A9CCF5
color13 #EFB8DA
color14 #9AE6DC
color15 #FFF6E6

# Cursor
cursor #F08B43
cursor_text_color #0B1018

