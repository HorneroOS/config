# Hornero 199X — Kitty palette.
#
# Derived from profiles/themes/hornero-199x/theme.json (retrofuturist
# tokens: signal orange #F08B43, broadcast blue #7FB0E6 and phosphor
# green #91C8A2 over deep CRT ink #0B1018). Gated by
# scripts/check-terminal-contrast.py: foreground + colors 1-6/9-14 hold
# WCAG AA against the background (normals >= 4.5:1, brights >= 3.0:1
# bold/large-text floor) and red/green/yellow stay mutually
# distinguishable (CIE76 dE >= 10).

foreground #FFF6E6
background #0B1018

