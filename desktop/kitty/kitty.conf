# Keep remote control disabled: Kitty remote control can inject input into
# terminal windows, inspect their contents, and manage windows. Hornero's
# appearance and app-launch workflows do not use the remote-control protocol.
allow_remote_control no

# Initial window size in terminal cells; the launcher's working directory is inherited.
initial_window_width 80c
initial_window_height 24c

# Default shell (uncomment if you want to use tmux as in Kitty)
# shell /bin/zsh
# shell_args --login -c "tmux attach -t '(∩Ȍ▾Ȍ)⊃━☆ﾟ,*' 2> /dev/null || tmux new -s '(∩Ȍ▾Ȍ)⊃━☆ﾟ,*'"

# Factory default palette: Hornero Signal Night. Every theme ships a
# generated <theme-id>.conf next to this file (scripts/generate-appearance.py);
# applying a theme rewrites this include line and reloads Kitty.
include hornero-signal-night.conf

# Cursor settings
cursor_shape block
cursor_blink_interval 0

# Font settings (RFC 0001 §3.3 mono family; matches profiles/factory.json
# fonts.mono, desktop/qt6ct and fontconfig).
font_family IBM Plex Mono
bold_font IBM Plex Mono Bold
italic_font IBM Plex Mono Italic
bold_italic_font IBM Plex Mono Bold Italic
font_size 12.0

# Transparency (leave opaque here; compositor window opacity handles translucency
# so Kitty does not double-attenuate alpha on top of Hyprland/Niri rules).
background_opacity 1.0

# Window behavior
window_padding_width 15

# Scrollback history
scrollback_lines 2500
wheel_scroll_multiplier 3.0

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+page_up scroll_line_up
map ctrl+shift+page_down scroll_line_down
map ctrl+shift+home scroll_to_top
map ctrl+shift+end scroll_to_bottom
map ctrl+l clear_screen

# Mouse settings
mouse_hide_wait 0.0

# Bell
enable_audio_bell no
