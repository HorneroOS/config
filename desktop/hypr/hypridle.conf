# Hypridle configuration
# Modular, minimal defaults. Adjust timeouts as needed.
# Referencia: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# Inactivity watcher modules

# Lock after 7 minutes, turn off screen after 10, suspend after 30
listener {
  timeout = 420            # 7 min
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# No idle lock listener here on purpose (HorneroOS/shell#24): idle lock
# is owned by the shell's IdleMonitors (180 s default). A second locker
# from hypridle would create the fatal cross-locker interleaving, and the
# historical dots-lockscreen binary no longer exists.

listener {
  timeout = 1800           # 30 min
  on-timeout = systemctl suspend
  on-resume = notify-send "Wake" "System resumed from suspend"
}

