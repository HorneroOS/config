# Hyprlock — Hornero Signal fallback lock (the shell lockscreen is primary).
# GENERATED by scripts/generate-appearance.py; do not hand-edit.
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
#
# Colours are hyprlang variables. The factory values below are
# hornero-signal-night; applying a theme writes the same variables to the
# Smart Colors file sourced next, before any widget is declared.

$hs_ground = rgba(0c0f13ff)
$hs_sunken = rgba(101419ff)
$hs_panel = rgba(181d24ff)
$hs_ink = rgba(ece6daff)
$hs_ink_muted = rgba(a8abadff)
$hs_rule_strong = rgba(707a85ff)
$hs_signal = rgba(f2a33aff)
$hs_glow = rgba(ffb650ff)
$hs_cue = rgba(7ec1eaff)
$hs_alert = rgba(f0705aff)

# Canonical Hornero XDG cache path (variables only, see signal_render.py).
source = ~/.cache/hornero/smart-colors/colors-hyprlock.conf

# Matte ground: no wallpaper blur, no glass (RFC 0001 §3.5).
background {
  monitor =
  color = $hs_ground
}

# Registration tick: the 2x10 signal mark beside the clock.
shape {
  monitor =
  size = 2, 10
  color = $hs_glow
  rounding = 0
  border_size = 0
  position = -140, 205
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  color = $hs_ink
  font_size = 56
  font_family = IBM Plex Sans Condensed
  position = 0, 160
  halign = center
  valign = center
}

# Eyebrow: Plex Mono, uppercase, muted. No date label: hyprlock renders
# $TIME/$USER but neither $DATE (literal) nor cmd[] output in this build,
# so a date label would be dead UI; the shell lockscreen shows the date.
label {
  monitor =
  text = 01 · LOCKED · $USER
  color = $hs_ink_muted
  font_size = 11
  font_family = IBM Plex Mono
  position = 0, 100
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 320, 44
  outline_thickness = 1
  rounding = 3
  dots_size = 0.2
  dots_spacing = 0.4
  dots_center = true
  dots_rounding = 0
  fade_on_empty = false
  placeholder_text = PASSWORD
  font_family = IBM Plex Mono
  font_color = $hs_ink
  inner_color = $hs_sunken
  outer_color = $hs_rule_strong
  check_color = $hs_cue
  fail_color = $hs_alert
  capslock_color = $hs_signal
  fail_text = $FAIL
  shadow_passes = 0
  position = 0, -40
  halign = center
  valign = center
}
