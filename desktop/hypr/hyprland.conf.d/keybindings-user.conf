# ============================================================================
# User Keybinding Overrides
# ============================================================================
#
# Managed by `horneroctl hardware keyboard rebind` (shell#236) — edit
# through the Control Center Keybindings pane or that command, not by
# hand, so overrides stay parseable and resettable.
#
# Each override is an unbind/bind pair:
#   unbind = SUPER, Return
#   bind = SUPER, X, exec, exo-open --launch TerminalEmulator
#
# This file is sourced after keybindings.conf, so these pairs win.
# `horneroctl hardware keyboard rebind reset --yes` empties it again.
# ============================================================================
