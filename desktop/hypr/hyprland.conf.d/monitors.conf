# ============================================================================
# Monitor Configuration - HorneroOS generic default (autodetect fallback)
# ============================================================================
# Curated default: no machine-specific outputs. Hyprland auto-detects
# connected displays. Hosts or installers that need fixed layouts should
# drop a host-specific override (not committed here); see docs/DECISIONS.md.
#
# Provenance: replaces the machine-specific eDP-1/HDMI-A-5 bindings from
# ulises-jeremias/dotfiles@b26db04 (monitors.conf NOT imported).
#
# Use 'hyprctl monitors' to see your current monitors.
# Format: monitor=NAME,RESOLUTION@RATE,POSITION,SCALE
# ============================================================================

# Fallback for any connected monitor
monitor=,preferred,auto,1

# ============================================================================
# Examples (uncomment and adapt per host, do NOT commit host specifics here)
# ============================================================================
# Laptop internal display:
# monitor=eDP-1,preferred,0x0,1
# External monitor to the right:
# monitor=HDMI-A-1,preferred,auto,1
# Mirror displays:
# monitor=eDP-1,preferred,0x0,1,mirror,HDMI-A-1
