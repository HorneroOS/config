# HorneroOS WirePlumber Bluetooth policy.
# System path: /etc/wireplumber/wireplumber.conf.d/51-hornero-bluetooth.conf
# User override wins: ~/.config/wireplumber/wireplumber.conf.d/ (same name).
# Removing this file restores stock WirePlumber Bluetooth behaviour.
#
# Codec order is deliberate: SBC-XQ ahead of AAC (SBC-XQ is the higher
# quality SBC variant and avoids AAC encoder variance across headsets).
# No autosuspend property is set here: USB autosuspend stays at the kernel
# default. A global btusb/usbcore autosuspend disable was rejected (battery
# cost); only a per-device udev quirk with a sourced VID:PID may change it.

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend = "native"
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source bap_broadcast_sink hfp_hf hfp_ag ]
  bluez5.codecs = [ ldac aptx_hd aptx sbc_xq aac sbc ]
}

wireplumber.settings = {
  # Warning: autoswitch grabs the headset mic (HFP mono) when an app opens
  # a capture stream, degrading playback from A2DP stereo. Pin a device to
  # its A2DP profile in the Bluetooth device details to opt that device out.
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
