# Curated session baseline for every session type (Hyprland, Niri, TTY
# logins that import the systemd user environment), not only Hyprland.
# systemd-environment-d-generator expands ${HOME} and earlier variables
# (verified against systemd 30-systemd-environment-d-generator).
# No BROWSER: HorneroOS has no factory browser yet (deferred product
# decision, see docs/DECISIONS.md). No machine or GPU variables here.
XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache
TERMINAL=kitty
PATH=${HOME}/.local/bin:${PATH}
