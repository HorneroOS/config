# HorneroOS Studio audio policy template: Advanced (OPT-IN, per-interface).
#
# Advanced mode is calibrated per audio interface by the user or a future
# horneroctl calibration flow. This template deliberately contains no rate
# or quantum values: copying a fixed quantum across interfaces can break
# devices that cannot sustain it.
#
# To use it, write your measured per-interface values into a copy under
# ~/.config/pipewire/pipewire.conf.d/ and remove the copy to restore the
# previous state exactly. Never add device names copied from another
# machine, realtime privilege changes, or IRQ/governor tuning here; the
# Hornero mode contract forbids them. See docs/STUDIO-AUDIO.md.
context.properties = {
    # default.clock.rate = 48000
    # default.clock.quantum = 128
}
