# HorneroOS Studio audio policy template: Low Latency (OPT-IN, not active).
#
# To try it, copy this file to ~/.config/pipewire/pipewire.conf.d/ as
# 50-hornero-studio-low-latency.conf, restart the user PipeWire services,
# and remove the copy to restore the previous state exactly.
#
# PROPOSAL VALUES, not measured per-device support: 128-frame quantum at
# 48 kHz suits many USB interfaces but can underrun others. Quantum is a
# scheduling period, not physical round-trip latency; only a physical
# loopback measurement reports real latency. QA owns support claims.
# See docs/STUDIO-AUDIO.md.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 128
    default.clock.min-quantum = 64
    default.clock.max-quantum = 256
}
