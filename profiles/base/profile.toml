# HorneroOS base profile: the single curated declarative desktop composition.
# scripts/materialize.sh is the canonical materializer for these modules.

[profile]
name = "base"
description = "HorneroOS Wayland-first desktop defaults (Hyprland validated; Niri experimental)."
provenance = "ulises-jeremias/dotfiles@b26db04 (curated subset, see docs/DECISIONS.md)"

[modules.hypr]
source = "desktop/hypr"
target = "{config}/hypr"
description = "Hyprland compositor defaults (generic monitor fallback included)."

[modules.niri]
source = "desktop/niri"
target = "{config}/niri"
description = "Niri session defaults; Shell bindings use horneroctl and unsupported Hyprland-only operations remain unavailable."

[modules.niri-portals]
source = "desktop/xdg-desktop-portal/niri-portals.conf"
target = "{config}/xdg-desktop-portal/niri-portals.conf"
description = "Use GTK for fallback and file chooser portals and GNOME for Niri screencasting."

[modules.kitty]
source = "desktop/kitty"
target = "{config}/kitty"

[modules.exo]
source = "desktop/xfce4/helpers.rc"
target = "{config}/xfce4/helpers.rc"
description = "Hornero default application helpers (Kitty terminal)."

[modules.qt6ct]
source = "desktop/qt6ct"
target = "{config}/qt6ct"
description = "Qt6 platform-theme defaults (qt6ct: Fusion + Hornero fonts/icons)."

[modules.gtk]
source = "desktop/gtk/settings.ini"
target = "{config}/gtk-3.0/settings.ini"
extra = [{ source = "desktop/gtk/gtkrc-2.0", target = "{home}/.gtkrc-2.0" }]

[modules.fontconfig]
source = "desktop/fontconfig"
target = "{config}/fontconfig"

[modules.fastfetch]
source = "desktop/fastfetch"
target = "{config}/fastfetch"

[modules.btop]
source = "desktop/btop"
target = "{config}/btop"

[modules.cava]
source = "desktop/cava"
target = "{config}/cava"

[modules.thunar]
source = "desktop/thunar"
target = "{config}/Thunar"

[modules.copyq]
source = "desktop/copyq/copyq.conf"
target = "{config}/copyq/copyq.conf"

[modules.handlr]
source = "xdg/handlr"
target = "{config}/handlr"
description = "XDG default-application handler."

[modules.git]
source = "xdg/git"
target = "{config}/git"
description = "Git defaults WITHOUT identity (config.user is never shipped)."

[modules.lib]
source = "lib/hornero"
target = "{home}/.local/lib/hornero"
description = "Hornero appearance and integration capabilities."

[modules.bin]
source = "bin"
target = "{home}/.local/bin"
description = "Installed Hornero command-line tools."

[modules.themes]
source = "profiles/themes"
target = "{data}/hornero/themes"
description = "Curated apply-once theme packs (theme.json + wallpaper refs, no binaries)."

[modules.gtk-theme]
source = "desktop/gtk-theme"
target = "{data}/themes"
description = "Real Hornero-Dark/Hornero-Light GTK 3+4 themes (theme trees only; src/ and tooling are dev-only)."

[modules.factory]
source = "profiles/factory.json"
target = "{data}/hornero/factory.json"
description = "Fresh-boot default record (Hornero Dark + font/icon pointers)."
