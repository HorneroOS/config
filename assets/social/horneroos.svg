  <g clip-path="url(#frame)" fill="none">
    <path d="M640,640 L1280,0" stroke="#F2AC52" stroke-width="2" opacity="0.7"/>
    <path d="M700,640 L1340,0" stroke="#8393A6" stroke-width="1" opacity="0.5"/>
    <path d="M760,640 L1400,0" stroke="#2D3B4B" stroke-width="1"/>
    <path d="M580,640 L1220,0" stroke="#2D3B4B" stroke-width="1"/>
  </g>
  <g transform="translate(872,160) scale(1.2)">
    <defs>
