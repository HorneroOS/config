<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="HorneroOS social preview">
  <title>HorneroOS social preview</title>
  <desc>Hornero Signal Night card: bird mark, mono eyebrow, title, on-air bar and the 45 degree La Plata diagonal.</desc>
  <rect width="1280" height="640" fill="#0C1016"/>
  <rect x="24" y="24" width="1232" height="592" fill="#141B24" stroke="#2D3B4B" stroke-width="1"/>
