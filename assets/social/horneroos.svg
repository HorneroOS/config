  <rect x="72" y="352" width="96" height="4" fill="#F2AC52"/>
  <text x="72" y="430" font-family="IBM Plex Sans, sans-serif" font-size="28" fill="#A9B7C6">An Arch-based workstation OS family with a</text><text x="72" y="470" font-family="IBM Plex Sans, sans-serif" font-size="28" fill="#A9B7C6">visual language of its own: Hornero Signal.</text>
  <text x="72" y="568" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2.4" fill="#8393A6">HORNEROOS.COM</text>
