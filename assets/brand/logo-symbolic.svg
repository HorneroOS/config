<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="HorneroOS symbolic logo">
  <title>HorneroOS symbolic logo</title>
  <desc>Single-color mark using currentColor. The bird is knocked out, so it adapts to any foreground color.</desc>
  <defs>
    <mask id="hornero-knockout">
      <circle cx="128" cy="124" r="86" fill="#fff"/>
      <g fill="#000">
        <path d="M100,168 L52,206 L70,212 L114,180 Z"/>
        <ellipse cx="124" cy="140" rx="34" ry="42" transform="rotate(-12 124 140)"/>
        <circle cx="140" cy="92" r="24"/>
        <path d="M160,85 C169,88 180,93 189,100 L160,105 Z"/>
      </g>
    </mask>
  </defs>
  <circle cx="128" cy="124" r="86" fill="currentColor" mask="url(#hornero-knockout)"/>
  <path d="M36,200 C90,188 166,188 220,200" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
</svg>
