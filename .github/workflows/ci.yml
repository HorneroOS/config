---
name: config-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install pre-commit yamllint
      - name: Config syntax + personal-data guard
        run: scripts/validate.sh
      - name: Appearance contrast (WCAG AA)
        run: tests/test_contrast.sh
      - name: Hornero GTK theme (GTK3+GTK4, no GTK2)
        run: tests/test_gtk_theme.sh
      - name: CLI flags without which
        run: tests/test_cli_flags.sh
      - name: GTK state keeps no shell mode
        run: tests/test_gtk_state.sh
      - name: Materialization into temp HOME
        run: tests/test_materialize.sh
      - name: Shortcut manifest contract
        run: tests/test_shortcuts.sh
      - name: Desktop integration (hypr/kitty/qt/factory)
        run: tests/test_desktop_integration.sh
      - name: YAML lint
        run: "yamllint -d '{extends: default, rules: {line-length: {max: 120}}}' ."
      - name: pre-commit (whitespace, yaml/json/toml/xml, validate)
        run: pre-commit run --all-files --show-diff-on-failure
