---
name: config-ci

on:
  push:
  pull_request:

jobs:
  niri-config:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: Install Git and the Arch desktop validation packages
        run: pacman -Syu --noconfirm git niri ghostty kitty alacritty
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate the actual Niri configuration
        run: NIRI_CONFIG="$GITHUB_WORKSPACE/desktop/niri/config.kdl" niri validate
      - name: Validate shipped Kitty configs with Kitty's parser
        run: scripts/validate-kitty-config.sh
      - name: Validate shipped Alacritty configs with Alacritty's parser
        run: |
          for config in "$GITHUB_WORKSPACE"/desktop/alacritty/*.toml; do
            alacritty migrate --config-file "$config" --dry-run --silent
          done
      - name: Validate shipped Ghostty config and theme
        run: scripts/validate-ghostty-config.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install pre-commit yamllint
      - name: AUR package tag contract
        run: PYTHONPATH=. python3 tests/test_aur_release_stamp.py
      - name: Config syntax + personal-data guard
        run: scripts/validate.sh
      - name: Appearance contrast (WCAG AA)
        run: tests/test_contrast.sh
      - name: Native terminal palette renderers
        run: python3 tests/test_terminal_themes.py
      - name: Hornero GTK theme (GTK3+GTK4, no GTK2)
        run: tests/test_gtk_theme.sh
      - name: Factory GTK settings generation
        run: tests/test_gtk_settings_generation.sh
      - name: CLI flags without which
        run: tests/test_cli_flags.sh
      - name: GTK state keeps no shell mode
        run: tests/test_gtk_state.sh
      - name: Factory shell default matches HorneroOS/shell
        run: tests/test_shell_default_sync.sh
      - name: Layout presets match the pinned HorneroOS/shell source
        run: tests/test_shell_presets_sync.sh
      - name: Materialization into temp HOME
        run: tests/test_materialize.sh
      - name: Shortcut manifest contract
        run: tests/test_shortcuts.sh
      - name: Optional plugins never break a plugin-less session
        run: tests/test_optional_plugins.sh
      - name: Theme catalogue contract
        run: tests/test_catalogue.sh
      - name: Desktop integration (hypr/kitty/qt/factory)
        run: tests/test_desktop_integration.sh
      - name: Install lua for Hyprland Lua checks
        run: sudo apt-get install -y -qq lua5.4
      - name: Hyprland Lua-only migration (luac, parity, no legacy refs)
        run: tests/test_hyprland_lua.sh
      - name: Hornero switcher theme adapter
        run: tests/test_snappy_switcher_helper.sh
      - name: YAML lint
        run: "yamllint -d '{extends: default, rules: {line-length: {max: 120}}}' ."
      - name: pre-commit (whitespace, yaml/json/toml/xml, validate)
        run: pre-commit run --all-files --show-diff-on-failure
