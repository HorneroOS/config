# Repo policy for the HorneroOS deterministic PR-governance engine.
# Merged over safe defaults; see HorneroOS/.github governance/danger.
#
# Native theme files are GENERATED from the schema-v2 theme sources below
# (scripts/generate-appearance.py; regenerate must diff clean).

version: 1
kind: config
visual_paths:
  - "assets/**"
  - "desktop/**"
  - "**/*.svg"
generated_paths:
  - source: "profiles/themes/hornero-signal-night/theme.json"
    derivative: "desktop/qt6ct/colors/hornero-signal-night.conf"
  - source: "profiles/themes/hornero-signal-day/theme.json"
    derivative: "desktop/qt6ct/colors/hornero-signal-day.conf"
  - source: "profiles/themes/hornero-signal-night/theme.json"
    derivative: "desktop/gtk-theme/Hornero-Signal/gtk-4.0/gtk.css"
  - source: "profiles/themes/hornero-signal-day/theme.json"
    derivative: "desktop/gtk-theme/Hornero-Signal-Day/gtk-4.0/gtk.css"
policies:
  large_threshold: 800
  forbidden_paths:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/credentials*"
    - "**/*secret*"
  risky_paths:
    - ".github/workflows/**"
    - "profiles/themes/**"
    - "bin/**"
    - "lib/**"
